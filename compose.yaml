name: etf-f003

x-registros: &registros
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

x-aislamiento: &aislamiento
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [interna]
  logging: *registros
  pids_limit: 128

services:
  postgres:
    <<: *aislamiento
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    user: "70:70"
    restart: unless-stopped
    environment:
      POSTGRES_DB: etf
      POSTGRES_USER: etf_instalador
      POSTGRES_PASSWORD: ${ETF_INSTALADOR_CONTRASENA:?}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=trust"
      ETF_MIGRADOR_CONTRASENA: ${ETF_MIGRADOR_CONTRASENA:?}
      ETF_APP_CONTRASENA: ${ETF_APP_CONTRASENA:?}
      ETF_CALCULO_MEMORIA_CONTRASENA: ${ETF_CALCULO_MEMORIA_CONTRASENA:-}
      ETF_COPIA_CONTRASENA: ${ETF_COPIA_CONTRASENA:?}
    command:
      - postgres
      - -c
      - unix_socket_permissions=0700
      - -c
      - log_statement=none
      - -c
      - log_min_error_statement=panic
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
      - -c
      - log_connections=off
      - -c
      - log_disconnections=off
      - -c
      - log_hostname=off
      - -c
      - log_min_messages=panic
    volumes:
      - postgres_datos:/var/lib/postgresql
      - postgres_socket:/var/run/postgresql
      - ./despliegue/base/01_roles.sh:/docker-entrypoint-initdb.d/01_roles.sh:ro
      - ./despliegue/base/habilitar_calculo_memoria.sh:/opt/etf/habilitar_calculo_memoria.sh:ro
      - ./despliegue/base/preparar_roles.sh:/opt/etf/preparar_roles.sh:ro
    tmpfs:
      - /tmp:uid=70,gid=70,mode=0700,size=16m
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, etf_app, -d, etf]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 12
    mem_limit: 512m
    cpus: 1.0

  preparar-roles:
    <<: *aislamiento
    image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    user: "70:70"
    networks: []
    network_mode: none
    entrypoint: [/bin/sh, /opt/etf/preparar_roles.sh]
    environment:
      POSTGRES_DB: etf
      ETF_MIGRADOR_CONTRASENA: ${ETF_MIGRADOR_CONTRASENA:?}
      ETF_APP_CONTRASENA: ${ETF_APP_CONTRASENA:?}
      ETF_COPIA_CONTRASENA: ${ETF_COPIA_CONTRASENA:?}
      ETF_CALCULO_MEMORIA_CONTRASENA: ${ETF_CALCULO_MEMORIA_CONTRASENA:-}
    volumes:
      - postgres_socket:/var/run/postgresql:ro
      - ./despliegue/base/preparar_roles.sh:/opt/etf/preparar_roles.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 64m
    cpus: 0.5

  migrar:
    <<: *aislamiento
    build:
      context: .
      target: migrar
    environment:
      ETF_BD_HOST: postgres
      ETF_BD_PUERTO: "5432"
      ETF_BD_NOMBRE: etf
      ETF_MIGRADOR_CONTRASENA: ${ETF_MIGRADOR_CONTRASENA:?}
    depends_on:
      preparar-roles:
        condition: service_completed_successfully
    mem_limit: 128m
    cpus: 0.5

  app:
    <<: *aislamiento
    networks: [interna, entrada]
    build:
      context: .
      target: app
    restart: unless-stopped
    environment:
      ETF_HTTP_DIRECCION: 0.0.0.0:8080
      ETF_IDIOMAS_RUTA: /datos/idiomas
      ETF_TEMAS_RUTA: /datos/temas
      ETF_IDIOMA: es
      ETF_TEMA: expedientes-etf
      ETF_BD_HOST: postgres
      ETF_BD_PUERTO: "5432"
      ETF_BD_NOMBRE: etf
      ETF_BD_USUARIO: etf_app
      ETF_BD_CONTRASENA: ${ETF_APP_CONTRASENA:?}
      ETF_CALCULO_MEMORIA_CONTRASENA: ${ETF_CALCULO_MEMORIA_CONTRASENA:-}
      ETF_CLAMAV_DIRECCION: clamav:3310
      # Objetivo de memoria por debajo de mem_limit: los picos pasan a recolección
      # de basura antes de llegar al límite del contenedor.
      GOMEMLIMIT: 192MiB
    ports:
      - "127.0.0.1:${ETF_HTTP_PUERTO:-18083}:8080"
    volumes:
      - ./idiomas:/datos/idiomas:ro
      - ./temas:/datos/temas:ro
    depends_on:
      migrar:
        condition: service_completed_successfully
    mem_limit: 256m
    cpus: 1.0

  clamav:
    <<: *aislamiento
    image: clamav/clamav:1.4.3@sha256:75fb5fd95fcbe1d7e6d240c369c1572b686ee2c95949d1042b5148de8eddebb4
    user: "100:101"
    restart: unless-stopped
    entrypoint: [/usr/sbin/clamd]
    command: [--config-file=/etc/clamav/clamd.conf]
    volumes:
      - clamav_firmas:/var/lib/clamav:ro
      - ./despliegue/base/clamd.conf:/etc/clamav/clamd.conf:ro
    tmpfs:
      - /tmp:uid=100,gid=101,mode=0700,size=128m
    healthcheck:
      test: [CMD-SHELL, "printf 'nPING\n' | nc -w 2 127.0.0.1 3310 | grep -qx PONG"]
      interval: 10s
      timeout: 3s
      start_period: 90s
      retries: 18
    mem_limit: 2g
    cpus: 1.0

networks:
  entrada:
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
    ipam:
      config:
        - subnet: ${ETF_ENTRADA_SUBRED:-10.250.4.16/28}
  interna:
    internal: true
    ipam:
      config:
        - subnet: ${ETF_RED_SUBRED:-10.250.4.0/28}

volumes:
  postgres_datos:
  postgres_socket:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=70,gid=70,mode=0700,size=16m
  clamav_firmas:
