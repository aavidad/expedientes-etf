include /etc/openldap/schema/core.schema
include /etc/openldap/schema/cosine.schema
include /etc/openldap/schema/inetorgperson.schema
include /fixture/identidad.schema
pidfile /tmp/slapd.pid
argsfile /tmp/slapd.args
TLSCertificateFile /fixture/servidor.pem
TLSCertificateKeyFile /fixture/servidor.key
TLSCACertificateFile /fixture/servidor.pem
TLSVerifyClient never
modulepath /usr/lib/openldap
moduleload back_mdb.so
database mdb
maxsize 16777216
suffix "dc=etf,dc=interno"
rootdn "cn=admin,dc=etf,dc=interno"
directory /tmp/datos
access to attrs=userPassword by self write by anonymous auth by * none
access to * by users read by * none
