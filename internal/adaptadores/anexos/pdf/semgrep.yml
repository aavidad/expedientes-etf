rules:
  - id: etf-lector-pdf-solo-memoria
    languages: [go]
    severity: ERROR
    message: anexo.pdf_acceso_externo
    paths:
      include: [lector.go, campos.go, estructura.go, adaptador.go]
    pattern-either:
      - pattern: os.Open(...)
      - pattern: os.OpenFile(...)
      - pattern: os.Create(...)
      - pattern: os.CreateTemp(...)
      - pattern: os.ReadFile(...)
      - pattern: os.WriteFile(...)
      - pattern: http.Get(...)
      - pattern: http.Post(...)
      - pattern: http.NewRequest(...)
      - pattern: net.Dial(...)
  - id: etf-lector-pdf-sin-registros-de-datos
    languages: [go]
    severity: ERROR
    message: anexo.pdf_registro_de_datos
    paths:
      include: [lector.go, campos.go, estructura.go, adaptador.go]
    pattern-either:
      - pattern: fmt.Print(...)
      - pattern: fmt.Printf(...)
      - pattern: fmt.Println(...)
      - pattern: log.Print(...)
      - pattern: log.Printf(...)
      - pattern: log.Println(...)
      - pattern: slog.Info(...)
      - pattern: slog.Error(...)
      - pattern: println(...)
  - id: etf-lector-pdf-proceso-tipado
    languages: [go]
    severity: ERROR
    message: anexo.pdf_proceso_no_permitido
    paths:
      include: [lector.go, campos.go, estructura.go, adaptador.go]
    patterns:
      - pattern-either:
          - pattern: exec.Command(...)
          - pattern: exec.CommandContext(...)
      - pattern-not: exec.CommandContext($CTX, $EXE, "--lector-anexo-pdf")
