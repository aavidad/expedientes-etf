worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    access_log off;
    client_body_temp_path /tmp/cuerpo;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 20m;
    # Sólo este origen local se adapta al origen HTTPS exigido por la app.
    # Los orígenes ausentes o ajenos conservan el rechazo CSRF del servidor.
    map $http_origin $origen_demo {
        default $http_origin;
        "http://127.0.0.1:18083" "https://etf.demo.interno";
    }
    server {
        listen 8080;
        server_name 127.0.0.1;
        location / {
            proxy_pass http://app:8080;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_set_header Host etf.demo.interno;
            proxy_set_header Origin $origen_demo;
            # Sustituye cualquier valor del cliente: la app sólo confía en este proxy.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Connection "";
            proxy_http_version 1.1;
        }
    }
}
