Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
LocalSocketMode 600
TCPSocket 3310
TCPAddr 0.0.0.0
TemporaryDirectory /tmp
LogFile /dev/null
LogFileUnlock yes
LogFileMaxSize 0
LogTime no
LogVerbose no
LogClean no
LogSyslog no
ExtendedDetectionInfo no
StreamMaxLength 20M
MaxScanSize 100M
MaxFileSize 20M
MaxRecursion 16
MaxFiles 1000
MaxThreads 2
ReadTimeout 30
CommandReadTimeout 10
ConcurrentDatabaseReload no
AlertExceedsMax yes
SelfCheck 600
